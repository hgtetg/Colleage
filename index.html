<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Colleage — Study Smarter</title>
  <meta name="description" content="A responsive student study platform with subjects, schedules, study rooms, community, and analytics." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <div class="brand-mark">C</div>
        <div>
          <div class="brand">Colleage</div>
          <div class="brand-sub">Study workspace</div>
        </div>
      </div>

      <nav class="side-nav" aria-label="Services">
        <p class="nav-caption">Explore</p>
        <button class="side-link" data-side="jobs"><span>⌁</span> Find a work</button>
        <button class="side-link" data-side="scholarships"><span>✦</span> Scholarships</button>
        <button class="side-link" data-side="volunteer"><span>♡</span> Volunteer</button>
        <button class="side-link" data-side="donate"><span>◎</span> Donate to us</button>
      </nav>

      <div class="sidebar-spacer"></div>

      <div class="profile-card">
        <div class="avatar">HK</div>
        <div class="profile-copy">
          <strong>Hatem Khalifa</strong>
          <span id="roleLabel">Student</span>
        </div>
        <button class="icon-button" id="roleToggle" title="Toggle Student/Manager role">⇄</button>
      </div>
      <button class="side-link" data-side="profile"><span>◉</span> Profile</button>
      <button class="side-link" data-side="settings"><span>⚙</span> Settings</button>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button>
        <nav class="main-nav" aria-label="Primary">
          <button class="nav-link active" data-route="dashboard">Dashboard</button>
          <button class="nav-link" data-route="subjects">Subjects</button>
          <button class="nav-link" data-route="schedule">Schedule</button>
          <button class="nav-link" data-route="rooms">Study rooms</button>
          <button class="nav-link" data-route="community">Community</button>
        </nav>
        <div class="topbar-actions">
          <button class="icon-button" id="searchBtn" title="Search">⌕</button>
          <button class="icon-button notification" title="Notifications">◌<span></span></button>
        </div>
      </header>

      <section class="content" id="content"></section>
    </main>
  </div>

  <dialog id="modal">
    <form method="dialog" class="modal-card" id="modalCard">
      <button class="modal-close" value="cancel" aria-label="Close">×</button>
      <div id="modalContent"></div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
