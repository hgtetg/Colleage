<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Colleage — Study Workspace</title>
  <meta name="description" content="A focused study workspace for courses, subjects, schedules, study rooms and community.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="core.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand-row"><div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M4 5.5 12 2l8 3.5-8 3.5L4 5.5Z"/><path d="M6.5 8.5V14c0 1.5 2.5 3 5.5 3s5.5-1.5 5.5-3V8.5"/><path d="M20 6v6"/></svg></div><div><div class="brand">Colleage</div><div class="brand-sub">Study workspace</div></div></div>
    <div class="course-switcher"><span class="course-label">ACTIVE COURSE</span><button class="course-button" id="courseButton"><span class="course-dot"></span><span><strong id="courseTitle">Sign in first</strong><small id="courseMeta">Course context</small></span><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></div>
    <div class="sidebar-spacer"></div>
    <div class="profile-card"><div class="avatar" id="profileAvatar">G</div><div class="profile-copy"><strong id="profileName">Guest</strong><span id="roleLabel">Not signed in</span></div></div>
    <button class="side-link" id="profileLink"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span> Profile</button>
  </aside>
  <main class="main-panel">
    <header class="topbar">
      <div class="topbar-left"><button class="mobile-menu" id="mobileMenu" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><nav class="main-nav"><button class="nav-link active" data-route="dashboard">Dashboard</button><button class="nav-link" data-route="subjects">Subjects</button><button class="nav-link" data-route="schedule">Schedule</button><button class="nav-link" data-route="rooms">Study rooms</button><button class="nav-link" data-route="community">Community</button></nav></div>
      <div class="topbar-actions"><button class="search-pill" id="searchBtn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Find subject</span></button><button class="auth-button" id="authButton">Sign in</button></div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>
<dialog id="modal"><div class="modal-card"><button class="modal-close" id="modalClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button><div id="modalContent"></div></div></dialog>
<div class="mobile-backdrop" id="mobileBackdrop"></div>
<script src="auth-client.js"></script>
<script src="core-app.js"></script>
</body>
</html>
