<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1220" />
  <title>Colleage — Your Study OS</title>
  <meta name="description" content="A modern study workspace for subjects, schedules, study rooms, community, opportunities and academic progress." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 5.5 12 2l8 3.5-8 3.5L4 5.5Z"/><path d="M6.5 8.5V14c0 1.5 2.5 3 5.5 3s5.5-1.5 5.5-3V8.5"/><path d="M20 6v6"/></svg>
        </div>
        <div>
          <div class="brand">Colleage</div>
          <div class="brand-sub">Student workspace</div>
        </div>
      </div>

      <div class="course-switcher">
        <span class="course-label">ACTIVE COURSE</span>
        <button class="course-button" id="courseButton">
          <span class="course-dot"></span>
          <span><strong>Medicine · Stage 2</strong><small>University course</small></span>
          <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>

      <nav class="side-nav" aria-label="Student services">
        <p class="nav-caption">Opportunities</p>
        <button class="side-link" data-side="jobs"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18M10 12v2h4v-2"/></svg></span> Find work</button>
        <button class="side-link" data-side="scholarships"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 10 12 5l9 5-9 5-9-5Z"/><path d="M7 12.5V17c2 2 8 2 10 0v-4.5M21 10v6"/></svg></span> Scholarships</button>
        <button class="side-link" data-side="volunteer"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg></span> Volunteer</button>
        <button class="side-link" data-side="donate"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.7A4 4 0 0 1 19 11c0 5.6-7 10-7 10Z"/><path d="M12 8v7M8.5 11.5h7"/></svg></span> Donate</button>
      </nav>

      <div class="sidebar-spacer"></div>

      <div class="profile-card">
        <div class="avatar">HK</div>
        <div class="profile-copy">
          <strong>Hatem Khalifa</strong>
          <span id="roleLabel">Student</span>
        </div>
        <button class="icon-button" id="roleToggle" title="Switch Student/Manager role" aria-label="Switch role"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4M21 7H7a4 4 0 0 0-4 4M7 21l-4-4 4-4M3 17h14a4 4 0 0 0 4-4"/></svg></button>
      </div>
      <button class="side-link" data-side="profile"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span> Profile</button>
      <button class="side-link" data-side="settings"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.1A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.1A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.1A1.7 1.7 0 0 0 15.4 4a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.16.36.37.7.6 1 .3.35.7.56 1.1.6h.1v4h-.1c-.4.04-.8.25-1.1.6-.23.3-.44.64-.6 1Z"/></svg></span> Settings</button>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu" id="mobileMenu" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
          <nav class="main-nav" aria-label="Primary">
            <button class="nav-link active" data-route="dashboard">Dashboard</button>
            <button class="nav-link" data-route="subjects">Subjects</button>
            <button class="nav-link" data-route="schedule">Schedule</button>
            <button class="nav-link" data-route="rooms">Study rooms</button>
            <button class="nav-link" data-route="community">Community</button>
          </nav>
        </div>
        <div class="topbar-actions">
          <button class="search-pill" id="searchBtn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search</span><kbd>/</kbd></button>
          <button class="icon-button notification" id="notificationBtn" title="Notifications"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span></span></button>
        </div>
      </header>

      <section class="content" id="content"></section>
    </main>
  </div>

  <dialog id="modal">
    <form method="dialog" class="modal-card" id="modalCard">
      <button class="modal-close" value="cancel" aria-label="Close"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      <div id="modalContent"></div>
    </form>
  </dialog>

  <div class="mobile-backdrop" id="mobileBackdrop"></div>
  <script src="app.js"></script>
</body>
</html>
